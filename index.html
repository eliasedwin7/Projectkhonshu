<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khonshu — Night Sky</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; background: #000; overflow: hidden;
    font: 13px/1.4 "Segoe UI", system-ui, sans-serif; color: #c9d2ea;
  }
  #sky { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  body.idle, body.idle * { cursor: none; }

  #intro {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 20px; text-align: center;
    background: radial-gradient(ellipse at center, rgba(0,0,0,.2), rgba(0,0,0,.72));
    transition: opacity 2.5s ease; cursor: pointer; user-select: none;
  }
  #intro.gone { opacity: 0; pointer-events: none; }
  #intro h1 {
    margin: 0; padding-left: .6em; font-weight: 200; letter-spacing: .6em;
    font-size: clamp(28px, 6vw, 76px); color: #eef2ff;
  }
  #intro p { margin: 0; letter-spacing: .35em; text-transform: uppercase; opacity: .7; }
  #intro button {
    margin-top: 14px; padding: 12px 38px; font: inherit; letter-spacing: .3em;
    text-transform: uppercase; color: #eef2ff; background: rgba(140,165,255,.08);
    border: 1px solid rgba(170,190,255,.45); border-radius: 999px; cursor: pointer;
  }
  #intro button:hover { background: rgba(140,165,255,.2); }
  #intro small { margin-top: 18px; padding: 0 16px; opacity: .5; letter-spacing: .08em; line-height: 1.9; }

  #panel {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    display: grid; grid-template-columns: repeat(5, minmax(128px, 1fr)); gap: 12px 22px;
    width: max-content; max-width: calc(100vw - 32px); max-height: calc(100vh - 44px);
    box-sizing: border-box; overflow: auto;
    padding: 16px 22px; background: rgba(9,13,25,.8);
    border: 1px solid rgba(160,180,255,.16); border-radius: 14px;
    backdrop-filter: blur(8px); transition: opacity .6s;
  }
  body.intro #panel { display: none; }
  body.idle #panel { opacity: 0; pointer-events: none; }
  #panel label { display: flex; flex-direction: column; gap: 6px; letter-spacing: .06em; }
  #panel label > span { display: flex; justify-content: space-between; gap: 6px; }
  #panel output { opacity: .6; }
  #panel input[type=range] { width: 100%; margin: 0; accent-color: #8fa8ff; }
  #panel input[type=number], #panel input[type=datetime-local], #panel select {
    min-width: 0; box-sizing: border-box; padding: 2px 5px; font: inherit; color: #dfe6ff;
    background: rgba(140,165,255,.1); border: 1px solid rgba(170,190,255,.25); border-radius: 6px;
  }
  #panel input[type=number] { width: 50%; }
  #panel input[type=datetime-local] { flex: 1; width: 0; }
  #panel select { width: 100%; }
  #panel select option { background: #0b1020; }
  #panel .wide { grid-column: span 2; }
  #panel .row {
    grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px;
  }
  #panel .row label { flex-direction: row; align-items: center; gap: 7px; }
  #panel .row .spacer { flex: 1; }
  #panel button {
    padding: 6px 15px; font: inherit; color: #dfe6ff; background: rgba(140,165,255,.1);
    border: 1px solid rgba(170,190,255,.3); border-radius: 999px; cursor: pointer; white-space: nowrap;
  }
  #panel button:hover { background: rgba(140,165,255,.24); }
  #readout {
    grid-column: 1 / -1; max-width: 880px; opacity: .65; letter-spacing: .05em; font-variant-numeric: tabular-nums;
  }
  @media (max-width: 800px) {
    #panel { grid-template-columns: repeat(2, 1fr); }
    #panel .wide { grid-column: 1 / -1; }
  }
</style>
</head>
<body class="intro">
<canvas id="sky"></canvas>

<div id="intro">
  <h1>KHONSHU</h1>
  <p>night sky</p>
  <button id="begin">Begin</button>
  <small>F fullscreen &nbsp;·&nbsp; M mute &nbsp;·&nbsp; C pin constellations &nbsp;·&nbsp; N pin names &nbsp;·&nbsp; A aurora &nbsp;·&nbsp; D daylight &nbsp;·&nbsp; L live time<br>
    Space meteor &nbsp;·&nbsp; B fireball &nbsp;·&nbsp; S shower &nbsp;·&nbsp; click anything in the sky to identify it &nbsp;·&nbsp; move the mouse for controls</small>
</div>

<div id="panel">
  <label><span>Meteors <output id="o-meteors"></output></span><input type="range" id="meteors" min="0" max="40" step="1"></label>
  <label><span>Volume <output id="o-volume"></output></span><input type="range" id="volume" min="0" max="100" step="1"></label>
  <label><span>Brightness <output id="o-brightness"></output></span><input type="range" id="brightness" min="30" max="100" step="1"></label>
  <label title="How dark the site is: city lights hide the faint stars and the Milky Way"><span>Sky darkness <output id="o-darkness"></output></span><input type="range" id="darkness" min="0" max="100" step="5"></label>
  <label><span>Clouds <output id="o-clouds"></output></span><input type="range" id="clouds" min="0" max="100" step="5"></label>

  <label title="Set this to the angle the picture covers from where you lie for a life-size sky"><span>Field of view <output id="o-fov"></output></span><input type="range" id="fov" min="20" max="180" step="5"></label>
  <label><span>Tilt <output id="o-tilt"></output></span><input type="range" id="tilt" min="0" max="90" step="1"></label>
  <label title="The compass direction at the bottom edge of the picture"><span>Facing <output id="o-facing"></output></span><input type="range" id="facing" min="0" max="359" step="1"></label>
  <label title="1× is true size"><span>Moon size <output id="o-moon"></output></span><input type="range" id="moon" min="1" max="20" step="1"></label>
  <label title="How strong a display to show. At 'real only' it appears just when a real geomagnetic storm reaches your latitude"><span>Aurora <output id="o-aurora"></output></span><input type="range" id="aurora" min="0" max="100" step="5"></label>

  <label><span>Time speed <output id="o-speed"></output></span><input type="range" id="speed" min="0" max="4" step="1"></label>
  <label><span>Place</span><select id="city"><option value="">Custom</option></select></label>
  <label><span>Latitude / longitude</span><span><input type="number" id="lat" min="-90" max="90" step="0.01"><input type="number" id="lon" min="-180" max="180" step="0.01"></span></label>
  <label title="Uses this computer's clock, whatever place is chosen"><span>Jump to a date</span><span><input type="datetime-local" id="when" min="1800-01-01T00:00" max="2099-12-31T23:59"><button id="go">Go</button></span></label>
  <label><span>Music off after</span><select id="sleep">
    <option value="0">Never</option><option value="15">15 minutes</option><option value="30">30 minutes</option>
    <option value="60">1 hour</option><option value="90">90 minutes</option>
  </select></label>

  <div class="row">
    <label title="Otherwise the figures only show while you move the mouse"><input type="checkbox" id="lines"> Pin constellations</label>
    <label title="Otherwise the names only show while you move the mouse"><input type="checkbox" id="names"> Pin names</label>
    <label title="Sunset, dusk and dawn as they happen. Untick for night at any hour"><input type="checkbox" id="daylight"> Follow daylight</label>
    <label title="Real satellite orbits from celestrak.org and storm levels from noaa.gov"><input type="checkbox" id="online"> Live data</label>
    <label><input type="checkbox" id="mirror"> Mirror image</label>
    <label><input type="checkbox" id="sounds"> Meteor sounds</label>
  </div>
  <div class="row">
    <button id="locate">Locate me</button>
    <button id="live">Live time</button>
    <span class="spacer"></span>
    <button id="shower">Meteor shower</button>
    <button id="fs">Fullscreen</button>
  </div>
  <div id="readout"></div>
</div>

<script src="data/sky-data.js"></script>
<script src="data/sky-images.js"></script>
<script src="js/astro.js"></script>
<script src="js/audio.js"></script>
<script src="js/sky.js"></script>
</body>
</html>
